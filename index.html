<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery</title>
  </head>
  <body>
    <span class="onsale">Akce!</span>
    <div
      class="woocommerce-product-gallery woocommerce-product-gallery--with-images woocommerce-product-gallery--columns-4 images"
      data-columns="4"
      style="opacity: 0; transition: opacity 0.25s ease-in-out"
    >
      <div class="woocommerce-product-gallery__wrapper">
        <div class="woocommerce-product-gallery__image">
          <a href="111.png">
            <img
              fetchpriority="high"
              width="2560"
              height="2560"
              src="111.png"
              class="wp-post-image"
              alt="Landing page lifting"
              data-caption=""
              data-src="111.png"
              data-large_image="111.png"
              data-large_image_width="2560"
              data-large_image_height="2560"
              decoding="async"
              srcset="111.png 2560w"
              sizes="(max-width: 2560px) 100vw, 2560px"
            />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
